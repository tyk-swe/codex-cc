name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pinned so pull request results are reproducible. Keep it at or above
      # TESTED_CODEX_VERSION in plugins/codex/scripts/lib/codex.mjs; the weekly
      # Codex compatibility workflow covers the latest release.
      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.157.1

      - name: Show Codex version
        run: codex --version

      - name: Run test suite
        run: npm test

      - name: Run build
        run: npm run build

      - name: Run live Codex smoke test
        run: npm run test:live
        env:
          CODEX_LIVE_REQUIRED: "1"
