name: Codex Compatibility

# Catches app-server protocol drift from new Codex CLI releases before users
# do: typechecks against freshly generated bindings and drives the real
# `codex app-server` through the plugin (no OpenAI account needed).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-codex:
    name: Latest Codex CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install latest Codex CLI
        run: npm install -g @openai/codex@latest

      - name: Show Codex version
        run: codex --version

      - name: Run test suite
        run: npm test

      - name: Typecheck against the latest app-server protocol
        run: npm run build

      - name: Run live Codex smoke test
        run: npm run test:live
        env:
          CODEX_LIVE_REQUIRED: "1"
